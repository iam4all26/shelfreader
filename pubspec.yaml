name: shelf_reader
description: An offline-first personal PDF bookshelf and reader.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  pdfrx: ^2.11.0
  file_picker: ^13.3.2
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
